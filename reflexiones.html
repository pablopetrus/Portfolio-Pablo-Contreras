   @font-face  {
  font-family: BrandFont;
  src: url('/fonts/brand-font(3).woff2') format('woff2');
  font-display: swap;
}

:root  {
  color-scheme: light;
  --paper: #ffffff;
  --ink: #171717;
  --muted: #666666;
  --line: #dcd6cd;
  --orange: #e87500;
}

*  {
  box-sizing: border-box;
}

html  {
  scroll-behavior: smooth;
}

body  {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

a  {
  color: inherit;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

a:hover  {
  color: #ad5700;
}

a:focus-visible  {
  outline: 2px solid var(--orange);
  outline-offset: 5px;
}

.layout  {
  display: grid;
  grid-template-columns: minmax(205px, 22vw) minmax(0, 1fr);
  min-height: 100vh;
}

.rail  {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 35px clamp(24px, 3vw, 56px);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  background: #fafafa;
}

.brand  {
  font: 700 1.05rem/1 BrandFont, Inter, Arial, sans-serif;
  letter-spacing: -.03em;
  text-decoration: none;
}

.brand span, .eyebrow span, .signature span  {
  color: var(--orange);
}

.rail-nav  {
  margin-top: 90px;
  display: grid;
  gap: 22px;
  font: 600 .78rem/1.3 BrandFont, Inter, Arial, sans-serif;
  letter-spacing: .025em;
}

.rail-nav a  {
  text-decoration: none;
  width: max-content;
}

.rail-nav [aria-current]  {
  color: #ad5700;
}

.rail-note  {
  margin-top: auto;
  padding-top: 30px;
  border-top: 1px solid var(--line);
  font: 600 .69rem/1.7 BrandFont, Inter, Arial, sans-serif;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}

.rail-note strong  {
  display: block;
  margin-top: 8px;
  color: var(--ink);
  font-size: 1.15rem;
  letter-spacing: -.04em;
}

.page  {
  min-width: 0;
  padding: 0 clamp(28px, 7vw, 110px) 95px;
}

.topline  {
  max-width: 860px;
  margin: 0 auto;
  padding: 35px 0 22px;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid var(--line);
  font: 600 .7rem/1.4 BrandFont, Inter, Arial, sans-serif;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
}

.topline a  {
  text-decoration: none;
}

.essay  {
  max-width: 760px;
  margin: 0 auto;
}

.intro  {
  padding: clamp(56px, 8vw, 92px) 0 42px;
}

.eyebrow  {
  font: 700 .7rem/1.3 BrandFont, Inter, Arial, sans-serif;
  letter-spacing: .15em;
  text-transform: uppercase;
  margin: 0 0 24px;
}

h1  {
  font: 700 clamp(2.45rem, 4.6vw, 4.4rem)/1.06 BrandFont, Inter, Arial, sans-serif;
  letter-spacing: -.055em;
  margin: 0;
  max-width: 18ch;
}

.article-body  {
  max-width: 660px;
}

.article-body p  {
  font: 400 clamp(1.05rem, 1.3vw, 1.19rem)/1.72 Georgia, 'Times New Roman', serif;
  margin: 0 0 1.35em;
}

.signature  {
  margin: 62px 0 0;
  padding-top: 22px;
  border-top: 1px solid var(--line);
  font: 700 1.1rem/1.4 BrandFont, Inter, Arial, sans-serif;
}

.signature small  {
  display: block;
  margin-top: 7px;
  color: var(--muted);
  font: 500 .83rem/1.5 BrandFont, Inter, Arial, sans-serif;
}

.sources  {
  max-width: 660px;
  margin-top: 62px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font: 400 .78rem/1.65 BrandFont, Inter, Arial, sans-serif;
}

.sources h2  {
  color: var(--ink);
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: .15em;
}

.sources p  {
  margin: 7px 0;
}

.sources a  {
  color: var(--ink);
}

@media (max-width: 950px)  {
  .layout  {
    grid-template-columns: 1fr;
  }

  .rail  {
    position: relative;
    height: auto;
    padding: 22px 28px;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .rail-nav  {
    margin: 0;
    display: flex;
    gap: 20px;
  }

  .rail-note  {
    display: none;
  }

  .page  {
    padding: 0 28px 70px;
  }

  .topline  {
    padding-top: 24px;
  }

}

@media (max-width: 560px)  {
  .rail-nav a:first-child  {
    display: none;
  }

  .topline  {
    font-size: .62rem;
    letter-spacing: .1em;
  }

  .intro  {
    padding-top: 58px;
  }

  h1  {
    font-size: clamp(2.35rem, 10vw, 3.3rem);
  }

}

@media (prefers-reduced-motion: reduce)  {
  html  {
    scroll-behavior: auto;
  }

}

@media print  {
  :root  {
    --paper: #fff;
  }

  .layout  {
    display: block;
  }

  .rail, .topline, .sources  {
    display: none;
  }

  .page  {
    padding: 0;
  }

  .intro  {
    padding: 20px 0 35px;
  }

}
