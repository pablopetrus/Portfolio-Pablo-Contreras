name: Generate CV PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'onepage-cv.html'
      - 'cv-business.html'
      - 'scripts/generate_pdf.cjs'
      - 'scripts/generate_onepage_cv.cjs'
      - 'scripts/generate_business_cv.cjs'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install PDF renderer
        run: npm install --no-save --package-lock=false puppeteer@25.16.0

      - name: Generate PDF
        run: |
          mkdir -p /tmp/cv-before
          cp public/cv/*.pdf /tmp/cv-before/
          npm run generate-pdf
          npm run generate-onepage-cv
          npm run generate-business-cv

      - name: Ignore PDF metadata-only changes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          for file in public/cv/*.pdf; do
            previous="/tmp/cv-before/$(basename "$file")"
            if [ -f "$previous" ]; then
              before=$(mktemp -d)
              after=$(mktemp -d)
              pdftoppm -r 96 "$previous" "$before/page" >/dev/null 2>&1
              pdftoppm -r 96 "$file" "$after/page" >/dev/null 2>&1
              if diff -rq "$before" "$after" && diff -q <(pdftotext -layout "$previous" -) <(pdftotext -layout "$file" -); then
                cp "$previous" "$file"
              fi
              rm -r "$before" "$after"
            fi
          done

      - name: Commit PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/cv/Pablo_Contreras_CV.pdf public/cv/Pablo_Contreras_Onepage_CV.pdf public/cv/Pablo_Contreras_Business_CV.pdf
          git commit -m "docs: auto-update CV PDF" || echo "No changes to commit"
          git push
