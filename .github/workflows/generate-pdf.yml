name: Generate CV PDF

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'onepage-cv.html'
      - 'scripts/generate_pdf.cjs'
      - 'scripts/generate_onepage_cv.cjs'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install PDF renderer
        run: npm install --no-save --package-lock=false puppeteer@25.16.0

      - name: Generate PDF
        run: |
          npm run generate-pdf
          npm run generate-onepage-cv

      - name: Commit PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/cv/Pablo_Contreras_CV.pdf public/cv/Pablo_Contreras_Onepage_CV.pdf
          git commit -m "docs: auto-update CV PDF" || echo "No changes to commit"
          git push
